name: CI
on:
  push:
  pull_request:
  # "Run workflow" on main in the Actions tab builds, tests and, if green, publishes a release.
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install jt9, ft8code, Hamlib, PortAudio and PulseAudio
        run: sudo apt-get update && sudo apt-get install -y wsjtx libhamlib-utils libportaudio2 pulseaudio pulseaudio-utils libasound2-plugins
      - name: Start a loopback sound card
        # A PulseAudio null sink whose monitor is the default source: what the Linux backend plays through ALSA's
        # "pulse" device comes back on its input, so the loopback test can check transmit audio end to end.
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=costas
          pactl set-default-sink costas
          pactl set-default-source costas.monitor
          echo "COSTAS_AUDIO_LOOPBACK=ALSA:pulse" >> "$GITHUB_ENV"
      - run: scripts/ci.sh
      - name: Build the Linux package
        env:
          # Only release builds carry the Aptabase app key (not a secret: it ships inside the app), so test and pull-request builds never send usage statistics.
          APTABASE_APP_KEY: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'A-US-6947074211' || '' }}
        run: scripts/build-linux.sh ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: Costas-linux
          path: |
            artifacts/Costas-*-linux-x64.tar.gz
            artifacts/Costas-*-linux-x64.tar.gz.sha256
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: ./scripts/ci.ps1
        shell: pwsh
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Release runs code-sign the app and installers once Artifact Signing is set up (the ARTIFACT_SIGNING_* repository
      # variables and AZURE_* secrets; see scripts/sign.ps1). Test and pull-request builds stay unsigned.
      COSTAS_SIGN: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.ARTIFACT_SIGNING_ACCOUNT != '' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache jt9 and Hamlib downloads
        uses: actions/cache@v4
        with:
          path: third_party/.download
          key: third-party-${{ hashFiles('third_party/fetch.ps1') }}
      - name: Note an unsigned release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && env.COSTAS_SIGN != '1'
        run: echo "::warning::Code signing is not set up (no ARTIFACT_SIGNING_ACCOUNT variable), so this release is unsigned and SmartScreen will warn."
        shell: pwsh
      - name: Install the Artifact Signing module
        if: env.COSTAS_SIGN == '1'
        run: Install-Module ArtifactSigning -RequiredVersion 0.1.20 -Scope CurrentUser -Force
        shell: pwsh
      - name: Build installer
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ env.COSTAS_SIGN == '1' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ env.COSTAS_SIGN == '1' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ env.COSTAS_SIGN == '1' && secrets.AZURE_CLIENT_SECRET || '' }}
          # Only release builds carry the Aptabase app key (not a secret: it ships inside the app), so test and pull-request builds never send usage statistics.
          APTABASE_APP_KEY: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && 'A-US-6947074211' || '' }}
          # Release runs download the latest release's Velopack package so this one carries a delta from it.
          VELOPACK_PREVIOUS: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && '1' || '' }}
        run: ./scripts/build-installer.ps1 -BuildNumber ${{ github.run_number }}
        shell: pwsh
      - name: Check jt9 stays running (shared memory)
        shell: pwsh
        run: |
          # The staged jt9 (only the DLLs the installer ships), so a DLL it needs for shared memory cannot be missing.
          $out = dotnet run -c Release --project tools/Ft8Client.DecodeCli -- --jt9 artifacts/stage/third_party/wsjtx/bin/jt9.exe --keep-running --call W7LIT --grid DN40 samples/ft8/260101_000000.wav samples/ft8/260101_000015.wav | Out-String
          Write-Host $out
          if ($out -notmatch 'stays running' -or $out -notmatch '<PJ4/K1ABC> W7LIT DN40') { throw 'jt9 did not resolve the hashed call through shared memory' }
          dotnet test tests/Ft8Client.Decoding.Tests -c Release --filter "FullyQualifiedName~Jt9PersistentDecoderTests"
          if ($LASTEXITCODE -ne 0) { throw 'persistent decoder tests failed' }
      - name: Install, upgrade, start and uninstall
        run: ./scripts/test-installer.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Costas-Setup
          path: artifacts/Costas-Setup-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Costas-Velopack
          path: artifacts/velopack/
          if-no-files-found: error
  release:
    # Releases are cut on demand: a manual run of this workflow on main publishes its green build as a GitHub Release,
    # and the app's update check offers the newest one. Ordinary pushes and merges only build and test. The release
    # stays in this workflow so its version (<major>.<minor>.<run number>) keeps counting up from earlier releases.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [linux, windows, installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Costas-Setup
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Costas-linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Costas-Velopack
          path: velopack
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          f=$(ls Costas-Setup-*.exe)
          v=${f#Costas-Setup-}
          v=${v%.exe}
          sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"
          linux="Costas-$v-linux-x64.tar.gz"
          # Velopack's files (installer, this version's full package and delta, and the feed the app reads) sit beside the
          # classic installer, which builds from before Velopack still update through.
          gh release create "v$v" "$f" "$f.sha256" "$linux" "$linux.sha256" ../velopack/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Costas $v" --generate-notes
