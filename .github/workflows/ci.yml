name: CI
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install jt9, ft8code and Hamlib
        run: sudo apt-get update && sudo apt-get install -y wsjtx libhamlib-utils
      - run: scripts/ci.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: ./scripts/ci.ps1
        shell: pwsh
