name: CI
on:
  push:
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install jt9, ft8code and Hamlib
        run: sudo apt-get update && sudo apt-get install -y wsjtx libhamlib-utils
      - run: scripts/ci.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: ./scripts/ci.ps1
        shell: pwsh
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Cache jt9 and Hamlib downloads
        uses: actions/cache@v4
        with:
          path: third_party/.download
          key: third-party-${{ hashFiles('third_party/fetch.ps1') }}
      - name: Build installer
        run: ./scripts/build-installer.ps1 -BuildNumber ${{ github.run_number }}
        shell: pwsh
      - name: Install, upgrade, start and uninstall
        run: ./scripts/test-installer.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Costas-Setup
          path: artifacts/Costas-Setup-*.exe
          if-no-files-found: error
