<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>Costas remote</title>
<style>
:root{--bg:#141414;--card:#202020;--line:#333;--tx:#eee;--mut:#9a9a9a;--btn:#3a3a3a;--red:#e8584e;--halt:#b3261e;--grn:#4caf6a;--amb:#e0a83a;
  --tag-bg:#2f4a36;--tag-tx:#9fe0b0;--warn-bg:#3b2a12;--warn-line:#6b4a1a;--warn-tx:#f3c77a;--accent:#58a6ff}
@media (prefers-color-scheme: light){:root{--bg:#f3f3f3;--card:#fff;--line:#ddd;--tx:#1a1a1a;--mut:#666;--btn:#e4e4e4;--tag-bg:#dcf1e1;--tag-tx:#1f6b34;
  --warn-bg:#fff4e0;--warn-line:#e8c27a;--warn-tx:#7a4d00;--accent:#0a66c2}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:0;border-radius:8px;background:var(--btn);padding:10px 12px;font-weight:600;cursor:pointer}
button:disabled{opacity:.45}
button.red{background:var(--red);color:#fff}
button.next{background:var(--accent);color:#fff}
.top{padding:12px 16px 10px;border-bottom:1px solid var(--line);font-size:13px;color:var(--mut);position:sticky;top:0;background:var(--bg);z-index:2}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.freq{font-size:21px;color:var(--tx);font-weight:600;margin-top:4px}
.onair{background:var(--red);color:#fff;font-weight:700;padding:8px 16px;font-family:Consolas,monospace;font-size:14px}
main{padding:12px 14px 120px;display:flex;flex-direction:column;gap:12px;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.lbl{font-size:12px;color:var(--mut)}
.call{font-size:30px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub{font-size:13px;color:var(--mut)}
.reports{display:flex;gap:18px;margin-top:6px;font-size:13px;color:var(--mut)}.reports b{color:var(--tx);font-size:16px}
.steps{display:flex;align-items:center;margin:12px 0 8px}
.st{width:24px;height:24px;border-radius:50%;border:2px solid #666;font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--mut);flex:none}
.st.done{background:var(--btn);border-color:var(--btn);color:var(--tx)}
.st.sending{background:var(--red);border-color:var(--red);color:#fff}
.st.waiting{border-color:var(--accent);color:var(--accent)}
.bar{flex:1;height:2px;background:var(--line)}.bar.on{background:var(--mut)}
.msgs{display:flex;flex-direction:column;gap:6px}
.msg{border:1px dashed var(--line);border-radius:8px;padding:7px 10px}
.msg .m{font-family:Consolas,monospace;font-size:14px}
.msg .s{font-size:12px;color:var(--mut)}
.msg.theirs{margin-left:18px}.msg.mine{margin-right:18px}
.msg.done{border-style:solid}
.msg.waiting{border:2px solid var(--accent)}
.msg.sending{background:var(--red);border-color:var(--red);color:#fff}.msg.sending .s{color:#fff;opacity:.9}
.msg.jump{cursor:pointer}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:12px}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.list .it:first-of-type{border-top:0}
.c{font-weight:600;font-size:16px}.s{font-size:12px;color:var(--mut)}
.tag{white-space:nowrap;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--tag-bg);color:var(--tag-tx)}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.banner{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-tx);border-radius:12px;padding:12px;font-size:14px}
.note{position:fixed;left:14px;right:14px;bottom:110px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;display:none;z-index:3}
.haltbar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.halt{width:100%;background:var(--halt);color:#fff;border-radius:14px;padding:14px;font-size:19px;font-weight:800;letter-spacing:1px}
.halt span{display:block;font-size:12px;font-weight:400;letter-spacing:0;opacity:.9;margin-top:2px}
.halt.idle{background:#555}
.pair{max-width:360px;margin:12vh auto 0;padding:0 20px;display:flex;flex-direction:column;gap:14px}
.pair input{font:inherit;font-size:28px;letter-spacing:6px;text-align:center;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
.err{color:var(--red);font-size:14px;min-height:1.2em}
.hidden{display:none!important}
.slot{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px}
.slot .track{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.slot .fill{height:100%;width:0;background:var(--accent)}
.slot.tx .fill{background:var(--red)}
.tunebtn{background:none;padding:0;font-weight:600;text-align:left}
.tunebtn::after{content:" ▾";font-size:14px;color:var(--mut)}
.tabs{display:flex;gap:4px;padding:8px 14px 0;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;padding:7px 10px;font-size:13px;background:var(--card);border:1px solid var(--line)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mini{font-size:12px;color:var(--mut)}
.it .left{min-width:0;flex:1;cursor:pointer}
.it > button{flex:none;max-width:48%}
.it .left .c{overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 4px;text-align:center}
.stats b{display:block;font-size:22px}.stats span{font-size:11px;color:var(--mut)}
.dec{font-family:Consolas,monospace;font-size:12.5px;display:grid;grid-template-columns:3.6em 2.6em 3em 1fr;gap:0 6px;padding:4px 0;border-top:1px solid var(--line);cursor:pointer}
.dec:first-of-type{border-top:0}
.dec .msgt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dec .cty{grid-column:4;font-family:"Segoe UI",system-ui,sans-serif;font-size:11px;color:var(--mut)}
.dec.cq .msgt{color:var(--accent)}.dec.me{background:var(--warn-bg)}.dec.me .msgt{color:var(--red);font-weight:700}.dec.tx{color:var(--mut)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:5;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-height:85vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}.kv span:nth-child(odd){color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid button.on,.seg button.on{background:var(--accent);color:#fff}
.seg{display:flex;gap:6px}.seg button{flex:1}
.offset{display:flex;gap:6px}.offset input{flex:1;min-width:0;font:inherit;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.warnline{font-size:13px}
.board{display:flex;flex-direction:column;gap:12px}
.board .col{display:contents}
[data-pane=operate]{order:1}[data-pane=heard]{order:2}[data-pane=stations]{order:3}[data-pane=decodes]{order:4}[data-pane=signal]{order:5}[data-pane=log]{order:6}

/* Tablet: the desk's Operate layout, sized for fingers. Portrait gets one wide column with table rows; landscape adds
   the desk's right-hand column. */
@media (min-width:760px){
  html,body{font-size:16px}
  .top{padding:14px 24px 12px}
  .tabs{padding:10px 24px 0}.tabs button{flex:0 0 auto;padding:10px 22px;font-size:15px}
  .tabs button[data-phone]{display:none}
  main{padding:14px 24px 130px}
  button{min-height:44px;padding:10px 16px}
  .thead,.trow{display:grid;grid-template-columns:minmax(104px,1.1fr) 1.7fr 1.3fr 58px 1.6fr 1fr 1fr 104px;gap:0 10px;align-items:center}
  .thead{font-size:12px;color:var(--mut);padding:6px 0;border-bottom:1px solid var(--line)}
  .trow{padding:8px 0;border-top:1px solid var(--line);min-height:56px;font-size:14px}
  .trow:nth-of-type(2){border-top:0}
  .trow .cl{cursor:pointer;min-width:0}.trow .cl b{font-size:17px;display:block}
  .trow .cell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trow .cell.wrap{white-space:normal}
  .trow button{width:100%}
  .trow.wide2{grid-template-columns:minmax(120px,1.2fr) 2fr 3fr 112px}
  .thead.wide2{grid-template-columns:minmax(120px,1.2fr) 2fr 3fr 112px}
  .msgs.five{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .msgs.five .msg{margin:0}
  .msgs.five .msg .m{font-size:13px;overflow-wrap:anywhere}
  .card{padding:14px 16px}
  .call{font-size:34px}
  .btns{grid-template-columns:repeat(auto-fit,minmax(130px,180px));justify-content:end}
  .shade{align-items:stretch;justify-content:flex-end}
  .sheet{width:440px;max-height:none;height:100%;border-radius:16px 0 0 16px}
  .dec{font-size:14px;grid-template-columns:4.2em 3em 3.6em 1fr 12em;padding:6px 0}
  .dec .cty{grid-column:5;font-size:13px;align-self:center}
  .haltbar{padding:10px 24px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:flex-end;pointer-events:none}
  .halt{width:420px;padding:12px;font-size:18px;pointer-events:auto;box-shadow:0 4px 18px rgba(0,0,0,.35)}
  .note{left:auto;right:24px;width:420px}
}
@media (min-width:760px) and (max-width:1079px){
  .thead:not(.wide2) > :nth-child(7),.trow:not(.wide2) > :nth-child(7){display:none}
  .thead:not(.wide2),.trow:not(.wide2){grid-template-columns:minmax(104px,1.1fr) 1.7fr 1.3fr 58px 1.6fr 1fr 104px}
}
@media (min-width:1080px){
  .board{display:grid;grid-template-columns:minmax(0,1fr) 340px;align-items:start}
  .board .col{display:flex;flex-direction:column;gap:12px;min-width:0}
  .side .stats{grid-template-columns:repeat(2,1fr);row-gap:10px}
}
</style>
</head>
<body>

<section id="pairView" class="pair hidden">
  <div class="freq">Pair this phone</div>
  <div class="sub">On the station computer, open Settings, Mobile connection. Type the six-digit code shown there.</div>
  <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000 000">
  <button id="pairBtn" class="red">Pair</button>
  <div id="pairErr" class="err"></div>
</section>

<section id="opView" class="hidden">
  <div class="top">
    <div class="row"><span id="station">Costas</span><span class="pill"><span id="linkDot" class="dot"></span><span id="link">Connecting…</span></span></div>
    <div class="row"><button id="freq" class="freq tunebtn" title="Band, mode and Tx offset">—</button><span class="pill"><span id="radioDot" class="dot"></span>Radio</span></div>
    <div class="row" style="margin-top:3px"><span id="health"></span><span id="control"></span></div>
    <div id="slot" class="slot"><span id="slotLabel">Receiving</span><div class="track"><div id="slotFill" class="fill"></div></div><span id="slotLeft"></span></div>
  </div>
  <div id="onair" class="onair hidden"></div>
  <nav id="tabs" class="tabs">
    <button data-tab="operate">Operate</button><button data-tab="stations" data-phone>Stations</button><button data-tab="decodes">Decodes</button><button data-tab="signal" data-phone>Signal</button><button data-tab="log" data-phone>Log</button>
  </nav>
  <main>
    <div id="fault" class="banner hidden"></div>
    <div id="hunt" class="banner hidden" aria-live="polite"></div>
    <div id="meter" class="banner warnline hidden"></div>
    <div id="services" class="mini hidden"></div>
    <div id="board" class="board"><div class="col">
    <div data-pane="operate">
      <div class="card"><div id="contactBody"></div><div id="contactBtns" class="btns"></div></div>
      <div id="callers" class="card list hidden" style="margin-top:12px"></div>
      <div id="line" class="card list" style="margin-top:12px"></div>
    </div>
    <div data-pane="stations">
      <div id="repeats" class="card list"></div>
      <div id="watching" class="card list" style="margin-top:12px"></div>
    </div>
    <div data-pane="decodes"><div id="decodes" class="card"></div></div>
    </div><div class="col side">
    <div data-pane="heard"><div id="summary" class="card"></div></div>
    <div data-pane="signal"><div id="signal" class="card list"></div></div>
    <div data-pane="log"><div id="tonight" class="card list"></div></div>
    </div></div>
  </main>
  <div id="detailsShade" class="shade hidden"><div id="details" class="sheet"></div></div>
  <div id="tuneShade" class="shade hidden"><div id="tune" class="sheet"></div></div>
  <div id="note" class="note"></div>
  <div class="haltbar"><button id="halt" class="halt">HALT TX<span>Stops transmitting now. Receive keeps running.</span></button></div>
</section>

<script>
"use strict";
const KEY = "costas-remote-token";
const $ = id => document.getElementById(id);
let token = null, ws = null, state = null, pingAt = 0, lastMsg = 0, backoff = 1000, noteTimer = 0;

function load() { try { return localStorage.getItem(KEY); } catch { return null; } }
function save(t) { try { if (t) localStorage.setItem(KEY, t); else localStorage.removeItem(KEY); } catch { } }

// Builds an element; text always goes through textContent, never HTML (callsigns and messages come off the air).
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
function button(text, cls, onClick, disabled) {
  const b = el("button", cls, text);
  b.onclick = onClick;
  b.disabled = !!disabled;
  return b;
}

function showPair(msg) {
  $("opView").classList.add("hidden");
  $("pairView").classList.remove("hidden");
  $("pairErr").textContent = msg || "";
}
function showOp() {
  $("pairView").classList.add("hidden");
  $("opView").classList.remove("hidden");
}

$("pairBtn").onclick = async () => {
  const code = $("code").value.replace(/\D/g, "");
  if (code.length !== 6) { $("pairErr").textContent = "The code has six digits."; return; }
  $("pairBtn").disabled = true;
  try {
    const r = await fetch("/api/pair", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.token) { $("pairErr").textContent = j.error || "Pairing failed."; return; }
    token = j.token; save(token); showOp(); connect();
  } catch { $("pairErr").textContent = "Cannot reach the station. Is this phone on the same network?"; }
  finally { $("pairBtn").disabled = false; }
};

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify(obj)); return true; }
  note("Not connected to the station.");
  return false;
}
function cmd(type, extra) { send(Object.assign({ type }, extra || {})); }

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(proto + "//" + location.host + "/ws");
  setLink("amb", "Connecting…");
  ws.onopen = () => {
    ws.send(JSON.stringify({ type: "hello", token }));
    if (viewing) ws.send(JSON.stringify({ type: "show", call: viewing }));
  };
  ws.onmessage = ev => {
    lastMsg = Date.now();
    backoff = 1000;
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === "pong") { setLink("grn", "Link " + (Date.now() - pingAt) + " ms"); return; }
    if (m.type === "state") {
      state = m.state; render();
      if (m.note) note(m.note);
      if ($("link").textContent === "Connecting…" || $("link").textContent === "Reconnecting…") setLink("grn", "Connected");
    }
  };
  ws.onclose = ev => {
    ws = null;
    if (ev.reason === "unpaired") { token = null; save(null); showPair("This phone is not paired any more. Pair it again."); return; }
    setLink("amb", "Reconnecting…");
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 5000);
  };
}

// Heartbeat: the station stops transmitting when the phone in control is silent for 15 s.
setInterval(() => {
  if (ws && ws.readyState === WebSocket.OPEN) { pingAt = Date.now(); ws.send(JSON.stringify({ type: "ping" })); }
  if (lastMsg && Date.now() - lastMsg > 4000 && ws) setLink("amb", "No answer from the station");
}, 5000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && token && (!ws || ws.readyState > 1)) connect();
});

function setLink(color, text) {
  $("linkDot").style.background = "var(--" + color + ")";
  $("link").textContent = text;
}
function note(text) {
  const n = $("note");
  n.textContent = text; n.style.display = "block";
  clearTimeout(noteTimer); noteTimer = setTimeout(() => n.style.display = "none", 4000);
}

$("halt").onclick = () => cmd("halt");

function render() {
  const s = state; if (!s) return;
  $("station").textContent = "Costas · " + (s.myCall || "no callsign");
  $("freq").textContent = s.frequency;
  $("radioDot").style.background = s.radioOk ? "var(--grn)" : "var(--red)";
  $("radioDot").parentElement.title = s.radio;
  $("health").textContent = s.utc + " UTC · " + s.health;
  $("control").textContent = s.control === "you" ? "You control" : s.control === "other" ? "Another phone controls" : "Desk controls";

  const onair = $("onair");
  onair.classList.toggle("hidden", !s.transmitting);
  onair.textContent = s.transmitting ? "ON AIR  " + (s.onAir || "") : "";

  const f = $("fault");
  f.classList.toggle("hidden", !s.fault && s.radioOk);
  f.textContent = s.fault || (!s.radioOk ? "Radio: " + s.radio : "");

  const h = $("hunt");
  h.classList.toggle("hidden", !s.hunt);
  h.textContent = s.hunt ? "Hunt list · " + s.hunt : "";

  const m = $("meter");
  m.classList.toggle("hidden", !s.meter);
  m.textContent = s.meter ? "Last transmission: " + s.meter + (s.meterTip ? ". " + s.meterTip : "") : "";
  m.style.color = s.meterCritical ? "var(--red)" : "";
  $("services").classList.toggle("hidden", !s.services);
  $("services").textContent = s.services || "";

  slotAt = Date.now(); renderSlot();
  renderContact(s);
  renderCallers(s);
  renderLine(s);
  renderStations(s);
  renderDecodes(s);
  renderSignal(s);
  renderTonight(s);
  renderDetails(s);
  renderTune(s);

  const busy = s.transmitting || s.callingCq || (s.contact && s.contact.active);
  const h = $("halt");
  h.classList.toggle("idle", !busy);
  h.firstChild.textContent = busy ? "HALT TX" : "NOT TRANSMITTING";
  h.lastChild.textContent = busy ? "Stops transmitting now. Receive keeps running." : "Radio is receiving only";
}

// Each part is rebuilt only when its data changed: a button replaced under a finger loses the tap.
const cache = {};
function changed(key, data) {
  const j = JSON.stringify(data);
  if (cache[key] === j) return false;
  cache[key] = j;
  return true;
}

function renderContact(s) {
  const c = s.contact;
  const idle = !c || !c.active && c.steps.length === 0;
  const cqOff = !s.radioOk && !s.callingCq;
  // PSK and RTTY: the macro keys take the place of Resend and Call CQ (F1 is CQ); the next step's key is highlighted.
  const kbd = s.macros.length > 0;
  const btns = kbd
    ? s.macros.map(m => [m.caption, m.next ? "next" : "", "macro", false, m.key])
        .concat(!idle && c.active ? (c.canLogNow ? [["Log now", "", "logNow", false]] : []).concat([["Abandon", "red", "abandon", false]]) : [])
    : idle || !c.active
    ? [[s.callingCq ? "Stop CQ" : "Call CQ", s.callingCq ? "red" : "", "cq", cqOff]]
    : [["Resend", "", "resend", false]].concat(c.canLogNow ? [["Log now", "", "logNow", false]] : [], [["Abandon", "red", "abandon", false]]);
  if (changed("contactBtns", btns)) {
    $("contactBtns").replaceChildren(...btns.map(([text, cls, type, off, key]) => button(text, cls, () => cmd(type, key ? { key } : {}), off)));
  }
  if (!changed("contactBody", { c, cq: s.callingCq, wide, talk: s.conversation })) return;
  const box = $("contactBody"); box.replaceChildren();
  if (idle && kbd) {
    box.append(el("div", "lbl", s.callingCq ? "Calling CQ" : "Not in a contact"));
    box.append(el("div", "sub", s.callingCq ? "Waiting for a station to answer." : "Call a station in Next in line, or press F1 to call CQ."));
    box.append(conversation(s.conversation));
    return;
  }
  if (idle) {
    box.append(el("div", "lbl", s.callingCq ? "Calling CQ" : "Not in a contact"));
    box.append(el("div", "sub", s.callingCq ? "Waiting for a station to answer." : "Call a station in Next in line, or call CQ."));
    return;
  }
  box.append(el("div", "lbl", c.caption));
  const call = el("div", "call", c.call);
  if (c.need) call.append(el("span", "tag", c.need));
  box.append(call);
  if (c.subline) box.append(el("div", "sub", c.subline));
  const rep = el("div", "reports");
  const sent = el("span", null, "Sent "); sent.append(el("b", null, c.sent));
  const rcvd = el("span", null, "Received "); rcvd.append(el("b", null, c.received));
  rep.append(sent, rcvd); box.append(rep);

  // The progress strip, as on the desk.
  const strip = el("div", "steps");
  c.steps.forEach((st, i) => {
    if (i > 0) strip.append(el("div", "bar" + (st.look !== "upcoming" ? " on" : "")));
    strip.append(el("div", "st " + st.look, st.look === "done" ? "✓" : String(i + 1)));
  });
  box.append(strip);

  // PSK and RTTY: the latest of the conversation instead of the step messages.
  if (kbd) {
    box.append(conversation(s.conversation));
    return;
  }

  // The messages around the current step (the strip shows the rest), so Calling you and Next in line stay near the top.
  const msgs = el("div", "msgs");
  let cur = c.steps.findIndex(x => x.look === "sending" || x.look === "waiting");
  if (cur < 0) cur = c.steps.findIndex(x => x.look === "upcoming");
  if (cur < 0 || !c.active) cur = Math.max(0, c.steps.map(x => x.look).lastIndexOf("done"));
  // A tablet has room for every message under the strip, as on the desk.
  const shown = wide ? c.steps : c.active ? c.steps.slice(Math.max(0, cur - 1), cur + 2) : c.steps.slice(cur, cur + 1);
  if (wide) msgs.classList.add("five");
  shown.forEach(st => {
    const m = el("div", "msg " + (st.mine ? "mine " : "theirs ") + st.look + (st.canJump ? " jump" : ""));
    const who = el("div", "s", st.who + (st.time ? " · " + st.time : ""));
    m.append(who, el("div", "m", st.message), el("div", "s", st.status + (st.canJump ? " · tap to send this next" : "")));
    if (st.canJump) m.onclick = () => cmd("jump", { step: st.index });
    msgs.append(m);
  });
  box.append(msgs);
}

// The latest lines exchanged in a PSK or RTTY contact, mine dimmed as on the desk.
function conversation(lines) {
  const msgs = el("div", "msgs");
  lines.forEach(l => {
    const m = el("div", "msg done " + (l.mine ? "mine" : "theirs"));
    m.append(el("div", "s", l.who + " · " + l.time), el("div", "m", l.text));
    if (l.mine) m.style.opacity = ".7";
    msgs.append(m);
  });
  return msgs;
}

function renderCallers(s) {
  if (!changed("callers", s.callers)) return;
  const box = $("callers"); box.replaceChildren();
  box.classList.toggle("hidden", s.callers.length === 0);
  if (s.callers.length === 0) return;
  const head = el("div", "head"); head.append(el("b", null, "Calling you"), el("span", "s", String(s.callers.length)));
  box.append(head);
  s.callers.forEach(w => {
    const it = el("div", "it");
    const left = el("div", "left");
    left.onclick = () => openDetails(w.call);
    const c = el("div", "c", w.call + " ");
    if (w.need) c.append(el("span", "tag", w.need));
    left.append(c, el("div", "s", [w.place, w.line].filter(Boolean).join(" · ")));
    if (w.note) left.append(el("div", "s", w.note));
    it.append(left, button(w.button, "", () => cmd(w.command, { call: w.call }), w.queued));
    box.append(it);
  });
}

// A list whose rows are rebuilt only when they change; the "last heard" ages tick in place, so a tap is never lost.
function list(box, key, title, sub, rows, empty, build, columns) {
  const ages = rows.map(r => r.lastHeard || "");
  const shape = rows.map(r => Object.assign({}, r, { lastHeard: undefined }));
  if (changed(key, { title, sub, shape, empty, ok: state.radioOk, wide })) {
    box.replaceChildren();
    const head = el("div", "head"); head.append(el("b", null, title), el("span", "s", rows.length ? sub : ""));
    box.append(head);
    if (rows.length === 0 && empty) box.append(el("div", "s", empty));
    // On a tablet the rows are a table with the desk's column headings.
    if (wide && columns && rows.length) {
      const th = el("div", "thead" + (columns.length === 4 ? " wide2" : ""));
      columns.forEach(c => th.append(el("span", null, c)));
      box.append(th);
    }
    box._ages = rows.map(r => build(r));
    box.append(...box._ages.map(x => x.item));
  }
  (box._ages || []).forEach((x, i) => {
    if (!x.age) return;
    x.age.textContent = x.bare ? ages[i] : ages[i] ? (x.age.previousSibling ? " · " : "") + "Heard " + ages[i] : "";
  });
}

// The desk's Next in line columns; Chance carries what it is based on beside it, as on the desk.
const COLUMNS = ["Call", "Where", "Doing now", "Signal", "Chance", "Last heard", "Last worked", ""];

// A station row: tap the call for its details; the button calls or answers it.
function stationRow(r, command) {
  if (wide) {
    const row = el("div", "trow");
    const cl = el("div", "cl");
    cl.append(el("b", null, r.call));
    if (r.need) cl.append(el("span", "tag", r.need));
    cl.onclick = () => openDetails(r.call);
    const age = el("span", "cell wrap s");
    age.title = "Last heard";
    const chance = el("span", "cell wrap");
    chance.append(el("b", null, r.chance));
    if (r.chanceReason) chance.append(el("span", "s", " " + r.chanceReason));
    row.append(cl, el("span", "cell wrap", r.where), el("span", "cell", r.doing), el("span", "cell", r.db ? r.db + " dB" : ""),
      chance, age, el("span", "cell s", r.lastWorked));
    row.append(r.button ? button(r.button, "", () => cmd(command || "call", { call: r.call }), !state.radioOk) : el("span"));
    return { item: row, age, bare: true };
  }
  const it = el("div", "it");
  const left = el("div", "left");
  const c = el("div", "c", r.call + " ");
  if (r.need) c.append(el("span", "tag", r.need));
  left.append(c, el("div", "s", [r.doing, r.where, r.db ? r.db + " dB" : ""].filter(Boolean).join(" · ")));
  const more = [r.chance ? r.chance + " chance" + (r.chanceReason ? " (" + r.chanceReason + ")" : "") : "",
    r.lastWorked && r.lastWorked !== "Never" ? "Last worked " + r.lastWorked : ""].filter(Boolean).join(" · ");
  const line3 = el("div", "s", more);
  const age = el("span");
  line3.append(age);
  left.append(line3);
  left.onclick = () => openDetails(r.call);
  it.append(left);
  if (r.button) it.append(button(r.button, "", () => cmd(command || "call", { call: r.call }), !state.radioOk));
  return { item: it, age };
}

function renderLine(s) {
  list($("line"), "line", "Next in line", String(s.line.length), s.line, "Nobody you need is calling CQ right now.", r => stationRow(r), COLUMNS);
}

function renderStations(s) {
  if (changed("summary", s.summary)) {
    const box = $("summary"); box.replaceChildren();
    const u = s.summary;
    if (!u) { box.append(el("b", null, "Band"), el("div", "s", "Nothing decoded yet on this band.")); }
    else {
      box.append(el("b", null, u.title));
      const g = el("div", "stats");
      [[u.stationsHeard, "Stations heard"], [u.countries, "Countries"], [u.callingCq, "Calling CQ"], [u.youNeed, "You need"]].forEach(([v, l]) => {
        const d = el("div"); d.append(el("b", null, v), el("span", null, l)); g.append(d);
      });
      box.append(g, el("div", "s", u.caption));
    }
  }
  list($("repeats"), "repeats", "Repeats", "Already in your log on " + s.frequency.split(" · ")[1], s.repeats,
    "Nobody you have worked on this band is on the air right now.", r => stationRow(r), COLUMNS);
  list($("watching"), "watching", "Watching", "Needed, not callable now", s.watching, "Nobody needed is waiting to become callable.", w => {
    if (wide) {
      const row = el("div", "trow wide2");
      const cl = el("div", "cl");
      cl.append(el("b", null, w.call));
      if (w.need) cl.append(el("span", "tag", w.need));
      cl.onclick = () => openDetails(w.call);
      row.append(cl, el("span", "cell", w.where), el("span", "cell s", w.reason), el("span"));
      return { item: row };
    }
    const it = el("div", "it");
    const left = el("div", "left");
    const c = el("div", "c", w.call + " ");
    if (w.need) c.append(el("span", "tag", w.need));
    left.append(c, el("div", "s", [w.where, w.reason].filter(Boolean).join(" · ")));
    left.onclick = () => openDetails(w.call);
    it.append(left);
    return { item: it };
  }, ["Call", "Where", "Why not now", ""]);
}

function renderDecodes(s) {
  if (!changed("decodes", s.decodes)) return;
  const box = $("decodes"); box.replaceChildren();
  const head = el("div", "head"); head.append(el("b", null, "Band activity"), el("span", "s", "Newest first · tap a line for the station"));
  box.append(head);
  if (s.decodes.length === 0) box.append(el("div", "s", "Nothing decoded yet."));
  s.decodes.forEach(d => {
    const row = el("div", "dec " + d.kind);
    row.append(el("span", null, d.utc), el("span", null, d.db), el("span", null, d.hz), el("span", "msgt", d.message));
    if (d.country) row.append(el("span", "cty", d.country));
    if (d.sender) row.onclick = () => openDetails(d.sender);
    box.append(row);
  });
}

function renderSignal(s) {
  const g = s.signal;
  if (!changed("signal", g)) return;
  const box = $("signal"); box.replaceChildren();
  if (!g) return;
  const head = el("div", "head"); head.append(el("b", null, g.title), el("span", "s", g.source));
  box.append(head, el("div", null, g.headline));
  if (g.history && g.history.length) {
    box.append(el("div", "s", "Stations hearing you · every 5 minutes"));
    const chart = el("div");
    chart.style.cssText = "display:flex;align-items:stretch;gap:3px;margin:8px 0";
    chart.setAttribute("role", "img");
    const maximum = Math.max(1, ...g.history.map(b => b.stations));
    const time = b => new Date(b.startUtc).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    chart.setAttribute("aria-label", g.history.map(b => time(b) + ": " + b.stations + " stations" + (b.isCurrent ? " (incomplete)" : "")).join(", "));
    g.history.forEach((b, i) => {
      const column = el("div"); column.style.cssText = "flex:1;min-width:0;text-align:center;font-size:10px";
      column.title = time(b) + " · " + b.stations + " stations" + (b.isCurrent ? " · incomplete" : "");
      const barBox = el("div"); barBox.style.cssText = "height:82px;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;border-bottom:1px solid currentColor";
      barBox.append(el("span", null, b.stations));
      const bar = el("div"); bar.style.cssText = "background:currentColor;opacity:" + (b.isCurrent ? ".35" : ".75") + ";height:" + (b.stations / maximum * 64) + "px";
      barBox.append(bar); column.append(barBox, el("div", null, b.isCurrent ? "now*" : i % 3 === 0 ? time(b) : ""));
      chart.append(column);
    });
    box.append(chart, el("div", "s", "Last hour · local time · * current interval incomplete. Fewer transmissions or delayed reports can also lower counts."));
  }
  const kv = el("div", "kv"); kv.style.margin = "8px 0";
  kv.append(el("span", null, "Farthest"), el("span", null, g.farthest), el("span", null, "Best report"), el("span", null, g.best));
  box.append(kv);
  if (g.neighbours) box.append(el("div", "s", g.neighbours));
  g.reports.forEach(r => {
    const it = el("div", "it");
    const left = el("div", "left");
    left.append(el("div", "c", r.call), el("div", "s", r.where));
    left.onclick = () => openDetails(r.call);
    it.append(left, el("div", "s", r.db + " dB · " + r.age));
    box.append(it);
  });
}

function renderTonight(s) {
  list($("tonight"), "tonight", s.tonightTitle, "", s.tonight, "No contacts yet tonight.", t => {
    const it = el("div", "it");
    const left = el("div", "left");
    const c = el("div", "c", t.call + " ");
    if (t.need) c.append(el("span", "tag", t.need));
    left.append(c, el("div", "s", [t.place, t.band].filter(Boolean).join(" · ")));
    left.onclick = () => openDetails(t.call);
    it.append(left, el("div", "s", t.time));
    return { item: it };
  });
}

// The station sheet: what the desk's details flyout shows, with Call or Answer.
let viewing = null;
function openDetails(call) { viewing = call; cmd("show", { call }); }
function closeDetails() { viewing = null; $("detailsShade").classList.add("hidden"); cmd("show", { call: "" }); cache.details = null; }
$("detailsShade").onclick = e => { if (e.target === $("detailsShade")) closeDetails(); };

function renderDetails(s) {
  const d = viewing && s.details && s.details.call === viewing.toUpperCase() ? s.details : null;
  $("detailsShade").classList.toggle("hidden", !d);
  if (!d) return;
  const heard = d.heard;
  if (changed("details", Object.assign({}, d, { heard: !!heard, ok: s.radioOk }))) {
    const box = $("details"); box.replaceChildren();
    const top = el("div", "row");
    const c = el("div", "call", d.call);
    if (d.need) c.append(el("span", "tag", d.need));
    top.append(c, button("Close", "", closeDetails));
    box.append(top, el("div", null, d.name), el("div", "sub", [d.location, d.county].filter(Boolean).join(" · ")));
    box._heard = el("div", "sub");
    box.append(box._heard);
    if (d.rarity) box.append(el("div", "warnline", d.rarity));
    const kv = el("div", "kv");
    [["Grid", d.grid], ["Bearing", d.bearing], ["Local time", d.localTime], ["Licence", d.licenseClass], ["QSL", d.qsl], ["Zones", d.zones]]
      .filter(([, v]) => v).forEach(([k, v]) => kv.append(el("span", null, k), el("span", null, v)));
    box.append(kv);
    if (d.pileup) box.append(el("div", "sub", d.pileup));
    if (d.lookupNote) box.append(el("div", "s", d.lookupNote));
    box.append(el("b", null, "Your contacts"));
    if (d.past.length === 0) box.append(el("div", "s", "No contacts with this call yet."));
    d.past.forEach(p => box.append(el("div", "s", [p.date, p.band, p.mode, p.confirmed].filter(Boolean).join(" · "))));
    if (d.button) box.append(button(d.button, "red", () => { cmd(d.command, { call: d.call }); closeDetails(); }, !s.radioOk));
  }
  $("details")._heard.textContent = heard ? "Heard now: " + heard : "Not heard on this band right now.";
}

// Band, mode and Tx offset, as the band menu and offset box on the desk.
let tuning = false;
$("freq").onclick = () => { tuning = true; cache.tune = null; render(); };
$("tuneShade").onclick = e => { if (e.target === $("tuneShade")) { tuning = false; render(); } };

function changeBand(band, mode) {
  const s = state;
  const busy = s.callingCq || (s.contact && s.contact.active);
  if (busy && !confirm("Changing band ends " + (s.callingCq ? "calling CQ" : "this contact") + ". Change band?")) return;
  cmd("band", { band, mode });
}

function renderTune(s) {
  $("tuneShade").classList.toggle("hidden", !tuning);
  if (!tuning || !changed("tune", { b: s.bands, band: s.band, mode: s.mode, can: s.canChangeBand, o: s.offset, a: s.offsetAuto })) return;
  const box = $("tune"); box.replaceChildren();
  const top = el("div", "row"); top.append(el("b", null, "Band and offset"), button("Close", "", () => { tuning = false; render(); }));
  box.append(top);
  if (!s.canChangeBand) box.append(el("div", "s", "Wait until this transmission ends to change band."));
  const seg = el("div", "seg");
  ["FT8", "FT4"].forEach(m => seg.append(button(m, s.mode === m ? "on" : "", () => { if (s.mode !== m) changeBand(s.band, m); }, !s.canChangeBand)));
  box.append(el("div", "lbl", "Mode"), seg, el("div", "lbl", "Band"));
  const grid = el("div", "grid");
  s.bands.forEach(b => grid.append(button(b.name, b.key === s.band ? "on" : "", () => { if (b.key !== s.band) changeBand(b.key); }, !s.canChangeBand)));
  if (s.bands.length === 0) box.append(el("div", "s", "Band changes are not available from the phone."));
  box.append(grid, el("div", "lbl", "Tx offset · " + s.offset));
  const row = el("div", "offset");
  const input = el("input"); input.type = "number"; input.inputMode = "numeric"; input.min = 200; input.max = 2900; input.step = 10;
  input.value = s.offsetHz; input.setAttribute("aria-label", "Tx offset in hertz");
  row.append(input, button("Use", "", () => cmd("offset", { hz: parseInt(input.value, 10) })));
  box.append(row, button("Automatic (picks a clear spot)", s.offsetAuto ? "on" : "", () => cmd("offsetAuto")),
    el("div", "s", "Or type a fixed offset from 200 to 2900 Hz and press Use."));
}

// The slot countdown runs on the phone between states, from the station's position in the slot.
let slotAt = 0;
function renderSlot() {
  const s = state; if (!s) return;
  // PSK and RTTY have no slots: the station sends a zero length, and the bar is hidden rather than left frozen.
  $("slot").classList.toggle("hidden", !s.slotLengthMs);
  if (!s.slotLengthMs) return;
  const into = Math.min(s.slotLengthMs, s.slotIntoMs + (Date.now() - slotAt));
  $("slot").classList.toggle("tx", s.transmitting);
  $("slotLabel").textContent = s.slotLabel;
  $("slotFill").style.width = (100 * into / s.slotLengthMs).toFixed(1) + "%";
  $("slotLeft").textContent = Math.max(0, Math.ceil((s.slotLengthMs - into) / 1000)) + " s";
}
setInterval(renderSlot, 200);

// Tabs; the one in use is remembered on this phone.
const TAB = "costas-remote-tab";
let tab = "operate";
try { tab = localStorage.getItem(TAB) || "operate"; } catch { }
// Which parts each tab shows. A tablet shows the whole Operate view at once, like the desk, so it has two tabs.
const PHONE_TABS = { operate: ["operate"], stations: ["heard", "stations"], decodes: ["decodes"], signal: ["signal"], log: ["log"] };
const TABLET_TABS = { operate: ["operate", "heard", "stations", "signal", "log"], decodes: ["decodes"] };
const wideQuery = matchMedia("(min-width: 760px)");
let wide = wideQuery.matches;
function showTab(t) {
  const tabs = wide ? TABLET_TABS : PHONE_TABS;
  if (!tabs[t]) t = "operate";
  tab = t;
  try { localStorage.setItem(TAB, t); } catch { }
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  document.querySelectorAll("[data-pane]").forEach(p => p.classList.toggle("hidden", !tabs[t].includes(p.dataset.pane)));
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
showTab(tab);
// Turning a tablet or resizing a window rebuilds the lists in the other layout.
wideQuery.addEventListener("change", e => {
  wide = e.matches;
  Object.keys(cache).forEach(k => delete cache[k]);
  showTab(tab);
  render();
});

token = load();
if (token) { showOp(); connect(); } else showPair();
</script>
</body>
</html>
