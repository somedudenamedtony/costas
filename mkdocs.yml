# The Costas website (landing page and user manual), published to GitHub Pages by .github/workflows/manual.yml.
# The pages live in manual/ (docs/ holds the build specification, not user documentation). The landing page is
# manual/index.md; the manual starts at manual/introduction.md.
site_name: Costas
site_description: Costas is a free FT8, FT4, PSK31, PSK63 and RTTY program for Windows that shows you stations, not messages.
site_url: https://costasdigi.com/
repo_url: https://github.com/somedudenamedtony/costas
repo_name: somedudenamedtony/costas
edit_uri: edit/main/manual/
docs_dir: manual
site_dir: site
copyright: © 2026 Ember Ridge Development. Costas is free software under the GNU General Public License, version 3 or later.

theme:
  name: material
  custom_dir: manual-theme
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  logo: images/costas.svg
  favicon: images/costas.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys

extra_css:
  - stylesheets/theme.css

extra:
  owner: Ember Ridge Development
  # Set to the donation page's address to show the Support links on the home page and in the manual footer.
  support_url: https://ko-fi.com/emberridgedev

nav:
  - Home: index.md
  - About: about.md
  - Getting started:
      - Introduction: introduction.md
      - Install: install.md
      - First-run setup: setup.md
  - Operating:
      - The Operate screen: operate.md
      - Making contacts: contacts.md
      - Maps and who hears you: maps.md
      - Raw decodes: raw-decodes.md
      - PSK31, PSK63 and RTTY: keyboard-modes.md
      - Hunt list and alerts: hunt.md
      - Operating from a phone: phone.md
  - Your log:
      - Log, QRZ, LoTW and ADIF: log.md
      - Awards and when to look: awards.md
  - Reference:
      - Settings: settings.md
      - Keyboard shortcuts: shortcuts.md
      - Troubleshooting: troubleshooting.md
      - Building from source: building.md
      - Code signing policy: code-signing.md
