# User manual for Costas, published to GitHub Pages by .github/workflows/manual.yml.
# The pages live in manual/ (docs/ holds the build specification, not user documentation).
site_name: Costas user manual
site_description: How to install, set up and operate Costas, a station-centric FT8 and FT4 client.
site_url: https://somedudenamedtony.github.io/costas/
repo_url: https://github.com/somedudenamedtony/costas
repo_name: somedudenamedtony/costas
edit_uri: edit/main/manual/
docs_dir: manual
site_dir: site
copyright: Costas is free software under the GNU General Public License, version 3 or later.

theme:
  name: material
  logo: images/costas.svg
  favicon: images/costas.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - First-run setup: setup.md
  - Operating:
      - The Operate screen: operate.md
      - Making contacts: contacts.md
      - Maps and who hears you: maps.md
      - Raw decodes: raw-decodes.md
  - Your log:
      - Log, QRZ and ADIF: log.md
  - Reference:
      - Settings: settings.md
      - Keyboard shortcuts: shortcuts.md
      - Troubleshooting: troubleshooting.md
      - Building from source: building.md
